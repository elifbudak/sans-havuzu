<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Şans Havuzu</title>
  </head>
  <body>
    <div class="container">
      <h1>Şans Havuzu</h1>
      <h3>
        Şans havuzu seçeneklerin ile doldur, ekleme işlemin tamamlandığında
        enter tuşuna bas ve şansın ne geldiğine bak
      </h3>

      <textarea
        id="textarea"
        placeholder="Şans havuzu seçeneklerini buraya yaz..."
      ></textarea>

      <div id="tags">
        <span class="tag">Örnek Seçenek 1</span>
        <span class="tag">Örnek Seçenek 2</span>
        

      </div>
      <small>Yazdığınız her seçeneğin sonuna boşluk yerine virgül (',') koyun.</small>
    </div>

    <script src="app.js"></script>
  </body>
</html>
